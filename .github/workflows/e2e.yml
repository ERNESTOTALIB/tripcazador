name: E2E — Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "tripcazador-web/**"
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tripcazador-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tripcazador-web/package-lock.json

      - name: Install deps
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: https://api.tripcazador.com
        run: npm run build

      - name: Start Next.js
        env:
          PORT: 3000
        run: |
          npm run start &
          for i in {1..30}; do
            curl -sSf http://localhost:3000 > /dev/null && break
            sleep 2
          done

      - name: Run Playwright tests (chromium only)
        env:
          BASE_URL: http://localhost:3000
        # SSS161: --project=chromium limita a 1 browser (era todos los 8
        # tras SSS157, lo que excedía timeout 20min y se cancelaba).
        # Multi-browser cross-browser está cubierto por
        # scroll-regression.yml (8-project matrix dedicado).
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tripcazador-web/playwright-report/
          retention-days: 14

