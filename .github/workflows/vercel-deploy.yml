name: Deploy Web → Vercel

# Auto-deploy del frontend Next.js en Vercel cada vez que hay un push a main
# que toca tripcazador-web/. Reemplaza la rotación manual del token.
#
# Secrets necesarios:
#   VERCEL_TOKEN       — token con permiso de deploy (vercel.com/account/settings/tokens)
#   VERCEL_ORG_ID      — team_yGePQTjnzSAWEPzPG73xGlFE
#   VERCEL_PROJECT_ID  — prj_67nltvSOptrl1ZlfEWjQeAQrLLQu
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (opcionales — notificación)

on:
  push:
    branches: [main]
    paths:
      - "tripcazador-web/**"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build + deploy en Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tripcazador-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy (prebuilt)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Desplegado en $URL"

      - name: Smoke check tripcazador.com
        run: |
          sleep 5
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" https://tripcazador.com)
          if [ "$HTTP" != "200" ]; then
            echo "::warning::tripcazador.com devolvió $HTTP"
          else
            echo "✅ tripcazador.com: HTTP 200"
          fi

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS:   ${{ job.status }}
          URL:      ${{ steps.deploy.outputs.url }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            ICON="✅"
            [ "$STATUS" != "success" ] && ICON="🚨"
            MSG=$(printf '%s <b>Deploy Web: %s</b>\nURL: %s\nCommit: %s\nRun: https://github.com/%s/actions/runs/%s' \
              "$ICON" "$STATUS" "${URL:-n/a}" "${{ github.sha }}" "${{ github.repository }}" "${{ github.run_id }}")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d parse_mode=HTML \
              --data-urlencode "text=${MSG}" || true
          fi
