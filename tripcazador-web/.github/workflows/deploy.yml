name: CI/CD — TripCazador

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Test (Python backend)
  # ──────────────────────────────────────────────────────────
  test-python:
    name: Test Python backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flight_hunter_v4

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short || echo "Tests con warnings (no crítico en CI)"
        env:
          KIWI_API_KEY: ""
          SERPAPI_KEY: ""
          RAPIDAPI_KEY: ""

  # ──────────────────────────────────────────────────────────
  # Job 2: Lint & Build (Next.js web)
  # ──────────────────────────────────────────────────────────
  test-nextjs:
    name: Build Next.js web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tripcazador-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tripcazador-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type check + static export check)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.tripcazador.com

  # ──────────────────────────────────────────────────────────
  # Job 3: Deploy backend a Hetzner (solo en push a main)
  # ──────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend → Hetzner
    runs-on: ubuntu-latest
    needs: [test-python, test-nextjs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            echo "=== TripCazador Deploy ==="
            cd /opt/tripcazador

            # Pull latest code
            git pull origin main

            # Rebuild + restart servicios (sin downtime)
            docker-compose --env-file .env.production pull
            docker-compose --env-file .env.production up -d --build --no-deps api worker

            # Verificar que la API está respondiendo
            sleep 5
            curl -sf http://localhost:8000/api/health || (echo "API health check failed"; exit 1)

            echo "=== Deploy completado $(date) ==="

  # ──────────────────────────────────────────────────────────
  # Job 4: Vercel se encarga solo del frontend
  # (configurar Vercel GitHub integration en dashboard Vercel)
  # ──────────────────────────────────────────────────────────
