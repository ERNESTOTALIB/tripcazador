name: Premium Hotel Watchlist Cron — daily

# SSS323 (19 may 2026): cron diario que checkea hotel-watches Premium
# y dispara email si el precio_per_night sintético bajó del threshold.
#
# Reusa PRICE_ALERT_CRON_TOKEN_PREMIUM (mismo trust boundary).
# Cadencia: 8:30 UTC = 10:30 Madrid (15 min después del flight watch).

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger hotel-watchlist-cron endpoint
        id: send
        run: |
          STATUS=$(curl -s -o /tmp/hotel-watch.json -w "%{http_code}" \
            "https://tripcazador.com/api/premium/hotel-watchlist-cron?token=${{ secrets.PRICE_ALERT_CRON_TOKEN_PREMIUM }}" \
            --max-time 60)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          cat /tmp/hotel-watch.json | head -c 1500

          # DRIP-FIX (31 may 2026): fail loud si HTTP != 200 (job FAILED → telegram notify dispara)
          if [ "$STATUS" != "200" ]; then
            echo "::error::cron endpoint returned HTTP $STATUS"
            exit 1
          fi

      - name: Notify Telegram on failure
        if: failure() && secrets.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠ Premium hotel-watchlist-cron failed HTTP ${{ steps.send.outputs.status }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}" > /dev/null
