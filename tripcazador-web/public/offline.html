<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión — TripCazador</title>
  <meta name="theme-color" content="#0a1530">
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #0a1530 0%, #163a78 100%);
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 440px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #fbbf24;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #0a1530;
      font-weight: 800;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 16px;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .deals-cache {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      margin: 24px 0;
      text-align: left;
    }
    .deals-cache h2 {
      font-size: 14px;
      color: #fbbf24;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .deal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
    }
    .deal-item:last-child { border-bottom: none; }
    .deal-route { color: #fff; }
    .deal-price { color: #fbbf24; font-weight: 700; }
    .actions {
      display: flex;
      gap: 12px;
      flex-direction: column;
      margin-top: 32px;
    }
    button {
      padding: 14px 24px;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s;
      font-family: inherit;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #0a1530;
    }
    .btn-secondary {
      background: transparent;
      color: #94A3B8;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #64748B;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">✈</div>
    <h1>Sin conexión</h1>
    <p>No podemos conectar con tripcazador.com ahora mismo. Comprueba tu conexión o consulta los chollos guardados en caché.</p>

    <div class="deals-cache" id="cached-deals" style="display:none;">
      <h2>Tus chollos en caché</h2>
      <div id="cached-list"></div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="location.reload()">Reintentar conexión</button>
      <button class="btn-secondary" onclick="history.back()">Volver atrás</button>
    </div>

    <div class="footer">TRIPCAZADOR · CHOLLOS DE VUELO 24/7</div>
  </div>

  <script>
    // Intentar cargar chollos cacheados desde localStorage (favoritos)
    try {
      const favs = JSON.parse(localStorage.getItem("tripcazador_favorites") || "[]");
      if (favs.length > 0) {
        const list = document.getElementById("cached-list");
        const cached = document.getElementById("cached-deals");
        favs.slice(0, 4).forEach(f => {
          const item = document.createElement("div");
          item.className = "deal-item";
          item.innerHTML =
            '<span class="deal-route">' + (f.route || (f.origin + " → " + f.destination)) + '</span>' +
            '<span class="deal-price">' + (f.price_eur || f.price) + '€</span>';
          list.appendChild(item);
        });
        cached.style.display = "block";
      }
    } catch (e) { /* sin localStorage o sin favs */ }

    // Si vuelve la conexión, recargar automáticamente
    window.addEventListener("online", () => {
      setTimeout(() => location.reload(), 500);
    });
  </script>
</body>
</html>
