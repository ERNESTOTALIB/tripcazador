name: Instagram auto-publish deals

# SSS75 (May 2026): carrusel Canva-style con PIL+cairosvg generado en runtime.
# Output: 5 PNGs commiteados a ig-assets/{date-slug}/ y servidos via raw GH.
permissions:
  contents: write     # Para commitear ig-assets/{slug}/{N}.png
  actions: write      # SSS76c: trigger vercel-deploy.yml via API después del push

on:
  # SSS76 (May 2026): cron reactivado con PAGE token NEVER-EXPIRE
  # generado vía ig_token_never_expire.py (USER long-lived → /me/accounts).
  # Verificado /debug_token expires_at=0 = permanente.
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish top deal to Instagram (Canva carousel)
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # SSS75: cairosvg requiere libcairo + libpango (PIL trae el resto)
      - name: Install system deps for cairosvg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q libcairo2 libpango-1.0-0 libpangocairo-1.0-0 fonts-dejavu

      - name: Install Python deps
        run: |
          pip install --quiet Pillow cairosvg requests

      # SSS65: persistir historial de posts entre runs vía cache.
      - name: Restore post history cache
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: .instagram_post_history.json
          key: ig-post-history-v1-${{ github.run_id }}
          restore-keys: |
            ig-post-history-v1-

      - name: Run script
        env:
          SITE_URL: https://tripcazador.com
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_DEDUP_WINDOW: "2"
          IG_FILTER_TYPE: "flight"
          IG_MAX_PRICE: "100"
          # SSS75: carrusel Canva-style (PIL+cairosvg local + commit a ig-assets/)
          IG_CAROUSEL_MODE: "1"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          # SSS76c: necesario para que el script triggee vercel-deploy.yml
          # vía API tras pushear los PNGs (workflow_dispatch endpoint).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/instagram_publish_deals.py

      - name: Save post history cache (legacy)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .instagram_post_history.json
          key: ig-post-history-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # SSS80: persistir history en repo (data/instagram_post_history.json)
      # para que el dedup de destinos funcione DE VERDAD entre runs.
      # Antes el history sólo vivía en GH Actions cache (frágil) y cada run
      # veía history vacío → siempre publicaba el TOP deal (Múnich-Barcelona).
      - name: Commit IG post history to repo
        if: always()
        run: |
          if [ ! -f data/instagram_post_history.json ]; then
            echo "Sin history que commitear (script no se ejecutó o error)"
            exit 0
          fi
          git config user.email "ig-bot@tripcazador.com"
          git config user.name "TripCazador IG Bot"
          git add data/instagram_post_history.json
          if git diff --staged --quiet; then
            echo "Sin cambios en history — skip"
          else
            git commit -m "chore(ig): update post history (run ${{ github.run_id }}) [skip ci]"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                echo "✅ history pusheado (intento $i)"
                break
              fi
              echo "⚠️ push falló intento $i — pull --rebase"
              git pull --rebase origin main || git rebase --abort 2>/dev/null || true
            done
          fi
