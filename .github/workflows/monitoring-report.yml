name: Monitoring Report

# SSS90 (May 2026) — reporte unificado de tráfico, clicks, suscriptores
# Telegram/Instagram/Newsletter, IG history y catálogo de deals.
#
# Trigger:
#   - workflow_dispatch (manual desde la UI de GitHub Actions)
#   - schedule semanal (lunes 09:00 UTC) opcional
#
# El output se escribe en el "Step Summary" del run — visible en la UI sin
# necesidad de descargar artifacts.

on:
  workflow_dispatch:
  schedule:
    # Lunes 09:00 UTC = 11:00 CEST
    - cron: '0 9 * * 1'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar reporte
        env:
          SITE_URL: https://tripcazador.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/monitoring_report.py

      - name: Notificar Telegram (opcional)
        if: ${{ env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != '' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "text=📊 Monitoring report listo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
