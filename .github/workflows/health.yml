name: Health — watchdog

on:
  schedule:
    # SSS51: cada 60 min (era 30) para preservar Vercel invocations
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  watchdog:
    name: Run healthcheck watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run watchdog
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTH_URL: https://api.tripcazador.com/api/health
          WEB_URL: https://tripcazador.com
          DEALS_URL: https://api.tripcazador.com/api/deals
          DEALS_JSON_PATH: /nonexistent/skip-local
          WATCHDOG_STATE_FILE: ${{ github.workspace }}/watchdog-state.json
        run: python monitoring/watchdog.py

      - name: Upload watchdog state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-state
          path: watchdog-state.json
          retention-days: 2
