# fail2ban filter — scanners comunes contra Caddy
#
# Baneamos IPs que piden rutas típicas de exploits:
# wp-login, wp-admin, phpmyadmin, .env, .git, xmlrpc.php, vendor/phpunit, admin.php

[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/(wp-login\.php|wp-admin|phpmyadmin|\.env|\.git/|xmlrpc\.php|vendor/phpunit|admin\.php|cgi-bin|\.ds_store|\.well-known/assetlinks\.json|setup\.php|phpinfo\.php).*".*"status":(?:400|401|403|404).*$
ignoreregex =
