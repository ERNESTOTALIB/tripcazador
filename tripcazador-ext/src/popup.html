<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripCazador</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #030712;
      color: #f9fafb;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px;
      color: #fbbf24;
    }
    .tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9ca3af;
    }
    .stats {
      margin: 14px 0;
      padding: 12px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 10px;
      font-size: 12px;
      color: #d1d5db;
    }
    .stats span {
      color: #fbbf24;
      font-weight: 700;
    }
    .cta {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 10px 14px;
      background: #f59e0b;
      color: #030712;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
    }
    .cta:hover {
      background: #fbbf24;
    }
    .cta-secondary {
      background: #1f2937;
      color: #f9fafb;
    }
    .cta-secondary:hover {
      background: #374151;
    }
    .small {
      margin-top: 12px;
      font-size: 10px;
      color: #6b7280;
      text-align: center;
    }
    .small a {
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="tag">Caza-chollos · v0.1.0</div>
  <h1>🎯 TripCazador</h1>
  <div class="stats">
    <div>Deals cached: <span id="deals-count">…</span></div>
    <div>Última actualización: <span id="last-refresh">…</span></div>
  </div>
  <a class="cta" href="https://tripcazador.com/?utm_source=ext-chrome" target="_blank">Abrir TripCazador.com</a>
  <a class="cta cta-secondary" href="https://tripcazador.com/premium?utm_source=ext-chrome" target="_blank">Probar Premium 14d gratis</a>
  <div class="small">
    <a href="https://tripcazador.com/legal" target="_blank">Privacidad</a> ·
    <a href="https://tripcazador.com/faq" target="_blank">Ayuda</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
