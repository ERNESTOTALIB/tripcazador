# fail2ban filter — brute force contra /api/admin/*
#
# Empareja 401/403 en paths admin. La API devuelve 401 con mal token,
# 503 con ADMIN_TOKEN vacío — sólo baneamos 401/403.

[Definition]
failregex = ^<HOST> .*\"(?:GET|POST) /api/admin/[^\"]*\" (?:401|403) .*$
            ^.*"client_addr":"<HOST>".*"path":"/api/admin/.*".*"status":(?:401|403).*$
ignoreregex =
