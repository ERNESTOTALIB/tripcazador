name: Deploy Web → Vercel

# Auto-deploy a Vercel cuando cambia el frontend (tripcazador-web/**) o
# cuando se ejecuta manualmente. Reemplaza la integración nativa Vercel↔Git
# que nunca pudo conectarse en la UI (popup OAuth bloqueado el 2026-04-20).
#
# Sin este workflow, Vercel se queda congelado en el último deploy manual y
# todas las rutas/contenido nuevo (calculadoras, vuelos-baratos-[mes], i18n,
# regiones, comparativas) responden 404 en prod aunque el código esté en
# main. Este bug pasó silencioso varios días — los smoke tests prod
# (TRIPCAZADOR_PROD_SMOKE=1) lo detectan ahora.

on:
  # SSS 2026-05-02: push trigger desactivado para parar spam Telegram + ahorrar
  # runner minutes. Vercel Git integration ya redeploya en push a main.
  # Este workflow queda como fallback manual.
  workflow_dispatch:

jobs:
  deploy:
    name: Vercel deploy --prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tripcazador-web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env (prod)
        working-directory: tripcazador-web
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (prod)
        working-directory: tripcazador-web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy --prebuilt --prod
        working-directory: tripcazador-web
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Smoke test new deploy
        run: |
          # Espera 10s a que el alias se propague, luego verifica home + una ruta nueva
          sleep 10
          curl -fsS --max-time 15 https://tripcazador.com/ | grep -q TripCazador || (echo "home failed" && exit 1)
          curl -fsS --max-time 15 https://tripcazador.com/calculadora | grep -q -i calculadora || (echo "calc failed" && exit 1)
          echo "smoke OK"

Commit: ${{ github.sha }}
Deploy: ${DEPLOY_URL:-n/a}
Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi
