name: Lighthouse CI

# Bloquea PR si Web Vitals + a11y caen por debajo de los thresholds.
# Corre contra el preview deployment de Vercel.
#
# Thresholds (abr-2026o):
#   - Performance score >= 0.85 (LCP P75 < 2.5s, INP < 200ms, CLS < 0.1)
#   - Accessibility >= 0.95 (WCAG AA)
#   - Best practices >= 0.90
#   - SEO >= 0.95
#
# Si el PR no genera preview Vercel (forks externos, drafts), el workflow
# se skipea silenciosamente — no bloqueamos contribuciones por infra ajena.

on:
  pull_request:
    branches: [main]
    paths:
      - "tripcazador-web/**"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Esperar al preview Vercel — este action escucha al webhook.
      - name: Wait for Vercel preview
        id: wait_preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          allow_inactive: false
        continue-on-error: true

      - name: Skip if no preview URL
        if: steps.wait_preview.outputs.url == ''
        run: |
          echo "::warning::No preview URL — skipping Lighthouse"
          exit 0

      - name: Run Lighthouse CI
        if: steps.wait_preview.outputs.url != ''
        id: lhci
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ steps.wait_preview.outputs.url }}/
            ${{ steps.wait_preview.outputs.url }}/deals
            ${{ steps.wait_preview.outputs.url }}/blog
            ${{ steps.wait_preview.outputs.url }}/destinos/japon
            ${{ steps.wait_preview.outputs.url }}/destinos/lisboa
            ${{ steps.wait_preview.outputs.url }}/destinos/paris
            ${{ steps.wait_preview.outputs.url }}/it/destinos/japan
            ${{ steps.wait_preview.outputs.url }}/de/destinos/paris
            ${{ steps.wait_preview.outputs.url }}/vuelos/madrid-lisboa
            ${{ steps.wait_preview.outputs.url }}/vuelos/barcelona-paris
            ${{ steps.wait_preview.outputs.url }}/aerolineas/iberia
            ${{ steps.wait_preview.outputs.url }}/aerolineas/qr
            ${{ steps.wait_preview.outputs.url }}/comparar-aerolineas/iberia-vs-vueling
            ${{ steps.wait_preview.outputs.url }}/comparar-aerolineas/qatar-vs-emirates
          configPath: ".github/workflows/lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment results on PR
        if: steps.lhci.outputs.manifest != ''
        uses: actions/github-script@v7
        with:
          script: |
            const manifest = JSON.parse(`${{ steps.lhci.outputs.manifest }}`);
            const summary = manifest.map(r => {
              const s = r.summary || {};
              return `**${r.url}** — perf ${(s.performance*100).toFixed(0)}, a11y ${(s.accessibility*100).toFixed(0)}, bp ${(s['best-practices']*100).toFixed(0)}, seo ${(s.seo*100).toFixed(0)}`;
            }).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚦 Lighthouse CI\n\n${summary}\n\nFull report: ${process.env.LHCI_REPORT_URL || 'see job artifacts'}`
            });
