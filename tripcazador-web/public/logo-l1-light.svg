<?xml version="1.0" encoding="UTF-8"?>
<!--
  TripCazador L1 — blanco puro · LOGO LIGHT VARIANT
  Decisión brand: 2026-05-01
  Uso: Instagram, Pinterest, Facebook, email signature, lead magnets PDF, stickers
  Primary A1 (ámbar/marino) en logo-a1-primary.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="darkAmberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Fondo blanco con borde sutil -->
  <rect width="1080" height="1080" rx="160" fill="#ffffff" stroke="#e5e5e5" stroke-width="3"/>

  <!-- Radar (navy dark con baja opacity) -->
  <circle cx="540" cy="468" r="288" fill="none" stroke="#0a1530" stroke-width="6" stroke-dasharray="12 18" opacity="0.35"/>
  <circle cx="540" cy="468" r="192" fill="none" stroke="#0a1530" stroke-width="4.8" stroke-dasharray="6 24" opacity="0.3"/>
  <circle cx="540" cy="468" r="96" fill="none" stroke="#0a1530" stroke-width="3.6" opacity="0.25"/>

  <!-- Sweep line ámbar oscuro -->
  <line x1="540" y1="468" x2="750" y2="300" stroke="url(#darkAmberGrad)" stroke-width="15" stroke-linecap="round"/>

  <!-- Avión silueta ámbar oscuro -->
  <g transform="translate(540 468) rotate(-30) translate(-96 -15)">
    <path d="M0 0 L180 0 L162 -15 L75 -15 L0 -36 L-30 -15 L-96 -15 Z"
          fill="url(#darkAmberGrad)" stroke="#7c2d12" stroke-width="2.4"/>
    <circle cx="-6" cy="0" r="8.4" fill="#fef3c7"/>
  </g>

  <!-- Wordmark -->
  <text x="540" y="888" text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="108" font-weight="800" fill="#0a1530" letter-spacing="12">TRIP</text>
  <text x="540" y="1002" text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="108" font-weight="800" fill="#d97706" letter-spacing="12">CAZADOR</text>
</svg>
