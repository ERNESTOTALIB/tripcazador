name: CI — pytest + vitest

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install engine deps (best effort)
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          # Dependencias runtime principales (si existen requirements propios)
          if [ -f flight_hunter_v4/requirements.txt ]; then
            pip install -r flight_hunter_v4/requirements.txt || true
          fi
          if [ -f api/requirements.txt ]; then
            pip install -r api/requirements.txt || true
          fi

      - name: Run pytest with coverage
        env:
          KIWI_API_KEY: test-kiwi-key
          SERPAPI_KEY: test-serp-key
          RAPIDAPI_KEY: test-rapid-key
          TRAVELPAYOUTS_TOKEN: test-tp-key
          TP_MARKER: "999999"
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: |
          pytest tests/ \
            --cov=flight_hunter_v4 --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=30 \
            -v

      - name: Validate blog hero images (SSS56g — Unsplash 404 detector)
        run: python3 scripts/validate_blog_hero_images.py

      - name: Upload coverage to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml


  vitest:
    name: Frontend tests (vitest + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tripcazador-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tripcazador-web/package-lock.json

      - name: Install dependencies
        # SSS fix: npm ci falla con package-lock desincronizado. Usar
        # --legacy-peer-deps coherente con vercel.json.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        # Bloqueante: un error de tipos en un componente rompería el build en Vercel;
        # prefiero romper el PR a romper producción.
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

