name: Premium Watchlist Cron — daily

# SSS314 (19 may 2026): cron diario que recorre los watches activos
# de la watchlist Premium (deals específicos vigilados por el user)
# y dispara email si el precio bajó >= target_drop_pct.
#
# Reusa PRICE_ALERT_CRON_TOKEN_PREMIUM como secret (mismo trust boundary
# que el cron de price-alerts Premium).
#
# Cadencia: una vez al día a las 8:15 UTC (≈10:15 Madrid). Diario es
# suficiente — drops grandes (>=10%) no se evaporan en horas, y diario
# reduce ruido en el inbox del user vs cada 5min.

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger watchlist-cron endpoint
        id: send
        run: |
          STATUS=$(curl -s -o /tmp/watch.json -w "%{http_code}" \
            "https://tripcazador.com/api/premium/watchlist-cron?token=${{ secrets.PRICE_ALERT_CRON_TOKEN_PREMIUM }}" \
            --max-time 60)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          cat /tmp/watch.json | head -c 1500

          # DRIP-FIX (31 may 2026): fail loud si HTTP != 200 (job FAILED → telegram notify dispara)
          if [ "$STATUS" != "200" ]; then
            echo "::error::cron endpoint returned HTTP $STATUS"
            exit 1
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠ Premium watchlist-cron failed HTTP ${{ steps.send.outputs.status }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}" > /dev/null
