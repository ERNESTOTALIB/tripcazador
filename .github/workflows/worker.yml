name: Worker — Flight Hunter (cron 4h)

# Alternativa gratuita al worker en VM (e2-micro no tiene RAM para correr
# worker + api + postgres a la vez). Corre en runners de GitHub (2000 min/mes
# free en repos privados) cada 4h, genera deals.json y lo sube al API vía
# POST /api/admin/deals.
#
# SSS11 (may-2026): bumped 6h → 4h. Más frescura para featured deals,
# captura mejor ventanas error fares (suelen durar 2-6h). Coste extra:
# 6 runs/día × ~10 min ≈ 1800 min/mes (dentro del free tier 2000).

# SSS8: permiso explícito para que el bot pueda hacer push de deals.json
# (commit a tripcazador-web/public/deals-latest.json). Sin esto el push
# falla con 'Write access to repository not granted' (HTTP 403).
permissions:
  contents: write

on:
  schedule:
    # UTC — corre cada 4h: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo del hunter"
        required: false
        default: "all"
        type: choice
        options: [all, business-hunter, error-hunter, matrix]
      origins:
        description: "Preset de orígenes"
        required: false
        default: "tier1"
      window_start:
        description: "Días en el futuro (inicio)"
        required: false
        default: "45"
      window_end:
        description: "Días en el futuro (fin)"
        required: false
        default: "120"

jobs:
  hunt:
    name: Buscar chollos + publicar deals.json
    runs-on: ubuntu-latest
    # SSS8: bumped 25→45min. Vueling engine puede tardar hasta 8min (cap interno)
    # + Ryanair + Travelpayouts paralelos + commit/push. 25 min era apretado.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r flight_hunter_v4/requirements.txt
          # Extras opcionales (si algún motor los importa perezosamente)
          pip install requests

      - name: Compute date window
        id: dates
        run: |
          WS="${{ github.event.inputs.window_start || '45' }}"
          WE="${{ github.event.inputs.window_end || '120' }}"
          DATE_FROM=$(date -u -d "+${WS} days" +%Y-%m-%d)
          DATE_TO=$(date -u -d "+${WE} days" +%Y-%m-%d)
          echo "from=$DATE_FROM" >> $GITHUB_OUTPUT
          echo "to=$DATE_TO" >> $GITHUB_OUTPUT
          echo "Ventana: $DATE_FROM → $DATE_TO"

      - name: "Determine if hotels run (1x per day at 04 UTC)"
        id: hotels_flag
        run: |
          HOUR=$(date -u +%H)
          # SSS30: SerpAPI plan FREE = 250 queries/mes (NO 5000 — Hobby es $50/mo).
          # Budget 6 ciudades × 1 run/día = 180/mes (deja 70 reserva business class).
          # Hotels solo en cron 04:00 UTC. workflow_dispatch manual también activa.
          if [ "$HOUR" = "04" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "hunt=1" >> $GITHUB_OUTPUT
            echo "✅ Hotels enabled this run (hour=$HOUR or manual)"
          else
            echo "hunt=0" >> $GITHUB_OUTPUT
            echo "⏭️  Hotels skipped this run (hour=$HOUR, save SerpAPI free quota 250/mes)"
          fi

      - name: Run Flight Hunter
        env:
          # API keys (añadir todas como secrets en GitHub · Settings → Secrets)
          KIWI_API_KEY:        ${{ secrets.KIWI_API_KEY }}
          SERPAPI_KEY:         ${{ secrets.SERPAPI_KEY }}
          RAPIDAPI_KEY:        ${{ secrets.RAPIDAPI_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TP_MARKER:           ${{ secrets.TP_MARKER }}
          DUFFEL_TOKEN:        ${{ secrets.DUFFEL_TOKEN }}
          DUFFEL_NO_CAP:       ${{ secrets.DUFFEL_NO_CAP }}
          AMADEUS_API_KEY:     ${{ secrets.AMADEUS_API_KEY }}
          AMADEUS_API_SECRET:  ${{ secrets.AMADEUS_API_SECRET }}
          # SSS29: hotels run flag — 2x/día para no agotar SerpAPI Hobby
          HUNT_HOTELS:         ${{ steps.hotels_flag.outputs.hunt }}
          # Telegram alerts (opcional)
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd flight_hunter_v4
          python main.py \
            --mode "${{ github.event.inputs.mode || 'all' }}" \
            --origins "${{ github.event.inputs.origins || 'tier1' }}" \
            --date-from "${{ steps.dates.outputs.from }}" \
            --date-to "${{ steps.dates.outputs.to }}" \
            --quiet || echo "::warning::Hunter terminó con código != 0"
          # main.py escribe deals.json en report_dir (= parent dir, raíz del repo)
          ls -la ../deals.json || true

      - name: Verify deals.json exists
        id: verify
        run: |
          if [ ! -f deals.json ]; then
            echo "::error::deals.json no se generó en la raíz del repo"
            exit 1
          fi
          SIZE=$(wc -c < deals.json)
          TOTAL=$(python -c "import json; print(json.load(open('deals.json')).get('total_deals', 0))")
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "✅ deals.json: $TOTAL deals, $SIZE bytes"

      - name: Upload to VPS API (/api/admin/deals)
        # VPS endpoint puede no estar deployed (404). El path canónico es
        # git commit a public/deals-latest.json (paso siguiente).
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::ADMIN_TOKEN no configurado — skip VPS upload"
            exit 0
          fi
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST https://api.tripcazador.com/api/admin/deals \
            -H "X-Admin-Token: $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @deals.json || echo "000")
          cat /tmp/resp.json 2>/dev/null || true
          echo ""
          if [ "$HTTP" != "200" ]; then
            echo "::warning::VPS upload HTTP $HTTP — fallback a git commit"
          else
            echo "✅ VPS Upload OK — HTTP $HTTP"
          fi

      - name: Commit deals.json al repo (canonical path)
        # Path principal: el frontend lee tripcazador-web/public/deals-latest.json
        # como fallback cuando VPS está stale o caído.
        run: |
          set -e
          mkdir -p tripcazador-web/public
          cp -v deals.json tripcazador-web/public/deals-latest.json
          ls -la deals.json tripcazador-web/public/deals-latest.json
          # SSS81: forzar que generated_at del archivo cambie cada run (incluso si
          # los engines no devuelven nada nuevo). Antes el `cp` copiaba archivo
          # idéntico → git diff vacío → skip silencioso → frontend con stale data.
          python -c "
          import json, datetime, hashlib, os
          d = json.load(open('tripcazador-web/public/deals-latest.json'))
          if isinstance(d, dict):
              d['committed_at'] = datetime.datetime.utcnow().isoformat() + 'Z'
              d['run_id'] = '${{ github.run_id }}'
              json.dump(d, open('tripcazador-web/public/deals-latest.json', 'w'))
          deals = d.get('deals', d) if isinstance(d, dict) else d
          summary = {
            'total_deals': d.get('total_deals', len(deals) if isinstance(deals, list) else 0),
            'generated_at': datetime.datetime.utcnow().isoformat() + 'Z',
            'run_id': '${{ github.run_id }}',
            'sha256': hashlib.sha256(open('tripcazador-web/public/deals-latest.json','rb').read()).hexdigest()[:16],
          }
          json.dump(summary, open('tripcazador-web/public/deals-summary.json', 'w'), indent=2)
          print('Summary:', summary)
          "
          git config user.email "hunter-bot@tripcazador.com"
          git config user.name "TripCazador Hunter Bot"
          git add tripcazador-web/public/deals-latest.json tripcazador-web/public/deals-summary.json
          if git diff --staged --quiet; then
            echo "::warning::Sin cambios en deals.json — esto NO debería pasar tras committed_at fix. Investigar"
            git diff HEAD~3..HEAD -- tripcazador-web/public/deals-latest.json | head -20 || true
          else
            git commit -m "chore(hunter): refresh deals.json (run ${{ github.run_id }}) [skip ci]"
            # SSS79: retry loop con rebase. Antes el push fallaba sin recuperación
            # cuando otro commit llegaba a main entre el clone y el push, dejando
            # /api/deals con deals seed (12) en lugar de los 1248 reales del hunter.
            # Ahora reintenta hasta 5 veces con pull --rebase entre cada intento.
            PUSHED=0
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                PUSHED=1
                echo "✅ deals.json committeado y pusheado a public/ (intento $i)"
                break
              else
                echo "⚠️ Push falló intento $i — git pull --rebase y retry"
                git pull --rebase origin main || {
                  echo "::warning::pull --rebase falló intento $i"
                  git rebase --abort 2>/dev/null || true
                }
              fi
            done
            if [ "$PUSHED" -eq 0 ]; then
              echo "::error::Push falló 5 veces consecutivas — deals.json del runner se descarta"
              # No bloqueamos el workflow porque el artifact upload sigue activo
              # (deals-{run_id}.zip recoverable manualmente desde Actions UI).
            fi
          fi

      - name: Trigger price-alert matcher
        # Cruza price_alerts.json (server-side) con los deals recién subidos
        # y envía emails a usuarios con alertas que hacen match. SMTP_* vars
        # están configuradas en Fly.io como secrets.
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::ADMIN_TOKEN no configurado — skip matcher"
            exit 0
          fi
          HTTP=$(curl -sS -o /tmp/match.json -w "%{http_code}" \
            -X POST https://api.tripcazador.com/api/admin/match-price-alerts \
            -H "X-Admin-Token: $ADMIN_TOKEN")
          cat /tmp/match.json || true
          echo ""
          if [ "$HTTP" = "404" ]; then
            echo "::warning::Matcher no disponible (endpoint o token mal) — skip"
          elif [ "$HTTP" != "200" ]; then
            echo "::warning::Matcher devolvió HTTP $HTTP"
          else
            echo "✅ Matcher OK"
          fi

      - name: Archive deals.json as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deals-${{ github.run_id }}
          path: deals.json
          retention-days: 7

      - name: Notify Telegram (ONLY on failure or zero-deals)
        # Política anti-spam: solo notificar cuando algo va mal.
        # ✅ success silencioso. 🚨 failure / deals=0 / dispatch-manual notifica.
        if: failure() || (steps.verify.outputs.total == '0' && job.status == 'success')
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS:   ${{ job.status }}
          TOTAL:    ${{ steps.verify.outputs.total }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            MSG=$(printf '🚨 <b>Worker fallo: %s</b>\nDeals encontrados: %s\nRun: https://github.com/%s/actions/runs/%s' \
              "$STATUS" "${TOTAL:-0}" "${{ github.repository }}" "${{ github.run_id }}")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d parse_mode=HTML \
              --data-urlencode "text=${MSG}" || true
          fi
