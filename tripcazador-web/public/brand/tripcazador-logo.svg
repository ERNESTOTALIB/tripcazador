<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 500" role="img" aria-label="TripCazador">
  <title>TripCazador</title>
  <desc>Logo TripCazador — caza-chollos de vuelos desde Europa.</desc>

  <!-- Símbolo: diana con plane en el centro -->
  <g transform="translate(80, 100)">
    <!-- Círculos diana -->
    <circle cx="150" cy="150" r="148" fill="none" stroke="#f59e0b" stroke-width="6"/>
    <circle cx="150" cy="150" r="108" fill="none" stroke="#f59e0b" stroke-width="5" opacity="0.7"/>
    <circle cx="150" cy="150" r="68" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.5"/>
    <circle cx="150" cy="150" r="28" fill="#f59e0b"/>
    <!-- Crosshair -->
    <line x1="150" y1="0" x2="150" y2="48" stroke="#f59e0b" stroke-width="4"/>
    <line x1="150" y1="252" x2="150" y2="300" stroke="#f59e0b" stroke-width="4"/>
    <line x1="0" y1="150" x2="48" y2="150" stroke="#f59e0b" stroke-width="4"/>
    <line x1="252" y1="150" x2="300" y2="150" stroke="#f59e0b" stroke-width="4"/>
    <!-- Avión interior (silueta vertical) -->
    <path d="M150 130 L162 165 L185 178 L162 175 L160 195 L155 200 L150 205 L145 200 L140 195 L138 175 L115 178 L138 165 Z" fill="#030712" stroke="#030712" stroke-width="1"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(440, 175)">
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="120" font-weight="800" fill="#f9fafb" letter-spacing="-3">Trip<tspan fill="#f59e0b">Cazador</tspan></text>
    <text x="6" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#9ca3af" letter-spacing="3">CAZA-CHOLLOS DE VUELOS</text>
  </g>
</svg>
