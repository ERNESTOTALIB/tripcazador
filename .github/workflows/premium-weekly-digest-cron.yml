name: Premium Weekly Digest — domingos 9am

# SSS316 (19 may 2026): cron semanal que envía el digest Premium
# personalizado por email a cada user con alertas o búsquedas guardadas.
#
# Cadencia: domingo a las 7:00 UTC = 9:00 Madrid (verano).
# (En invierno serán las 8:00 Madrid — cerca de la franja de
# "café del domingo" que es la mejor para newsletters.)
#
# Reusa PRICE_ALERT_CRON_TOKEN_PREMIUM como secret (mismo trust
# boundary que el resto de crons Premium).
#
# El endpoint llama directamente a Resend API (RESEND_API_KEY) en
# lugar de pasar por /api/notify-alert porque el template HTML es
# distinto al de alerta puntual.

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger weekly-digest-cron endpoint
        id: send
        run: |
          STATUS=$(curl -s -o /tmp/digest.json -w "%{http_code}" \
            "https://tripcazador.com/api/premium/weekly-digest-cron?token=${{ secrets.PRICE_ALERT_CRON_TOKEN_PREMIUM }}" \
            --max-time 120)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          cat /tmp/digest.json | head -c 2000

          # DRIP-FIX (31 may 2026): fail loud si HTTP != 200 (job FAILED → telegram notify dispara)
          if [ "$STATUS" != "200" ]; then
            echo "::error::cron endpoint returned HTTP $STATUS"
            exit 1
          fi

      - name: Notify Telegram on failure
        if: failure() && secrets.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠ Premium weekly-digest-cron failed HTTP ${{ steps.send.outputs.status }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}" > /dev/null
