name: Deploy Web → Vercel

# Auto-deploy a Vercel cuando cambia el frontend (tripcazador-web/**) o
# cuando se ejecuta manualmente. Reemplaza la integración nativa Vercel↔Git
# que nunca pudo conectarse en la UI (popup OAuth bloqueado el 2026-04-20).
#
# Sin este workflow, Vercel se queda congelado en el último deploy manual y
# todas las rutas/contenido nuevo (calculadoras, vuelos-baratos-[mes], i18n,
# regiones, comparativas) responden 404 en prod aunque el código esté en
# main. Este bug pasó silencioso varios días — los smoke tests prod
# (TRIPCAZADOR_PROD_SMOKE=1) lo detectan ahora.
#
# SSS7 2026-05-03: bypass `vercel build` (rompe con `spawn sh ENOENT` en
# runners GH cuando re-ejecuta installCommand de vercel.json). Usamos
# `vercel deploy --prod --archive=tgz` que sube source a Vercel y deja que
# el builder cloud (donde sh sí existe) corra install + build.
#
# IMPORTANTE: corremos desde el REPO ROOT, no desde tripcazador-web/. El
# Vercel project tiene `rootDirectory=tripcazador-web` configurado, así
# que si corremos desde dentro vercel CLI duplica el path → error
# `tripcazador-web/tripcazador-web does not exist`.

on:
  push:
    branches: [main]
    paths:
      - "tripcazador-web/**"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Vercel deploy --prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # SSS313 anti-regresión: build local FIRST con npm.
      # SSS312 fix descubrió que route.ts custom exports (scoreDeal, etc)
      # rompen el type-check de Next pero el workflow seguía con success
      # porque vercel CLI tenía `continue-on-error: true`. Resultado:
      # deploys silenciosamente sirven el último build válido y nuevas
      # pages devuelven 404. Build local fail-fast cierra ese loop.
      - name: 🛡 Build sanity check (anti-regresión SSS313)
        working-directory: tripcazador-web
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          # Verificar que rutas clave existen en .next/server/app
          test -d .next/server/app/agencia || (echo "❌ /agencia NO compilada" && exit 1)
          test -d .next/server/app/panel/premium || (echo "❌ /panel/premium NO compilada" && exit 1)
          echo "✅ Build sanity OK — agencia + panel/premium compiladas"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env (prod) — desde repo root
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy --prod (cloud build) — desde repo root
        id: deploy
        continue-on-error: true
        run: |
          # SSS76e: el CLI a veces sale con "Unexpected error" después de
          # subir el tarball pero ANTES de aliasar a producción. Capturamos
          # stdout para extraer la deployment URL aunque el CLI falle, luego
          # promovemos manualmente vía `vercel promote`.
          set -o pipefail
          OUTPUT=$(vercel deploy --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel.out || true)
          # Vercel CLI imprime "Production: <url>" antes de empezar build
          URL=$(grep -oE 'https://tripcazador-[a-z0-9]+-ernesto-talibs-projects\.vercel\.app' /tmp/vercel.out | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Captured deploy URL: $URL"

      - name: Wait for build + promote to production
        id: promote
        run: |
          # SSS76h: vercel inspect --wait NO bloquea de verdad (sale en 10s).
          # En su lugar: poll vercel inspect cada 15s buscando state=READY,
          # max 10min. Después promote con --scope.
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then echo "❌ No deploy URL captured" && exit 1; fi
          echo "Polling $URL state until READY (max 10min)..."
          for i in $(seq 1 40); do
            STATE=$(vercel inspect "$URL" --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} 2>&1 | grep -oE 'status\s+(READY|ERROR|CANCELED|BUILDING|QUEUED|INITIALIZING)' | awk '{print $2}' | head -1 || echo "UNKNOWN")
            echo "  attempt $i: state=$STATE"
            if [ "$STATE" = "READY" ]; then
              echo "✅ Deployment READY"
              break
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "❌ Deployment $STATE — aborting promote"
              exit 1
            fi
            sleep 15
          done
          echo "Promoting $URL to production with --scope..."
          vercel promote "$URL" --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --yes 2>&1 || \
            vercel alias set "$URL" tripcazador.com --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} 2>&1 || \
            echo "WARN: promote+alias failed"

      - name: Smoke test new deploy
        run: |
          # SSS313: ampliado vs SSS7 inicial — testea rutas Premium SSS301+
          # para detectar rotos catastróficos sin tener que ir a PROD.
          sleep 20
          curl -fsS --max-time 15 https://tripcazador.com/ | grep -q TripCazador || (echo "home failed" && exit 1)
          curl -fsS --max-time 15 https://tripcazador.com/calculadora | grep -q -i calculadora || (echo "calc failed" && exit 1)
          # Premium + Agencia (SSS301-310) — solo verifica HTTP 200, no contenido
          for path in /agencia /agencia/vuelo /agencia/vuelo-hotel /panel/premium /panel/premium/alertas /panel/premium/busquedas /panel/premium/watchlist /panel/premium/digest /panel/premium/secret /panel/premium/hotel-watchlist /panel/premium/trip-planner /panel/agencia /premium /concierge/mis-pedidos; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://tripcazador.com$path")
            if [ "$STATUS" != "200" ]; then
              echo "❌ Smoke FAIL $path → HTTP $STATUS"
              exit 1
            fi
            echo "✅ $path → 200"
          done
          echo "smoke OK (14 critical routes Premium + Agencia + Watchlist + Digest + Secret + Hotel + TripPlanner + Concierge portal)"
