name: Premium Winback Cron — daily anti-churn

# SSS322 (19 may 2026): cron diario que detecta Premium con >14d sin
# entrar a /panel/premium (last_seen tracking) y envía email
# personalizado con su ROI + top 3 deals de su ruta favorita.
#
# Reusa PRICE_ALERT_CRON_TOKEN_PREMIUM (mismo trust boundary) y
# RESEND_API_KEY ya configurado para el digest semanal.
#
# Cadencia: 1x al día a las 10:30 UTC = 12:30 Madrid. Después del
# lunch break — la hora con mejor open-rate para emails B2C.

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

jobs:
  winback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger winback-cron endpoint
        id: send
        run: |
          STATUS=$(curl -s -o /tmp/winback.json -w "%{http_code}" \
            "https://tripcazador.com/api/premium/winback-cron?token=${{ secrets.PRICE_ALERT_CRON_TOKEN_PREMIUM }}" \
            --max-time 120)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          cat /tmp/winback.json | head -c 2000

      - name: Notify Telegram on failure
        if: steps.send.outputs.status != '200' && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠ Premium winback-cron failed HTTP ${{ steps.send.outputs.status }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}" > /dev/null
