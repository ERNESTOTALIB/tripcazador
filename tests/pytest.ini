[pytest]
minversion = 7.0
testpaths = unit engines api integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes
markers =
    slow: marca tests lentos (>500ms)
    integration: tests de integracion (requieren fixtures de datos)
    requires_net: tests que necesitan red (normalmente skipped en CI)
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
