name: Deploy Web → Vercel

# Auto-deploy a Vercel cuando cambia el frontend (tripcazador-web/**) o
# cuando se ejecuta manualmente. Reemplaza la integración nativa Vercel↔Git
# que nunca pudo conectarse en la UI (popup OAuth bloqueado el 2026-04-20).
#
# Sin este workflow, Vercel se queda congelado en el último deploy manual y
# todas las rutas/contenido nuevo (calculadoras, vuelos-baratos-[mes], i18n,
# regiones, comparativas) responden 404 en prod aunque el código esté en
# main. Este bug pasó silencioso varios días — los smoke tests prod
# (TRIPCAZADOR_PROD_SMOKE=1) lo detectan ahora.
#
# SSS7 2026-05-03: bypass `vercel build` (rompe con `spawn sh ENOENT` en
# runners GH cuando re-ejecuta installCommand de vercel.json). Usamos
# `vercel deploy --prod --archive=tgz` que sube source a Vercel y deja que
# el builder cloud (donde sh sí existe) corra install + build.
#
# IMPORTANTE: corremos desde el REPO ROOT, no desde tripcazador-web/. El
# Vercel project tiene `rootDirectory=tripcazador-web` configurado, así
# que si corremos desde dentro vercel CLI duplica el path → error
# `tripcazador-web/tripcazador-web does not exist`.

on:
  push:
    branches: [main]
    paths:
      - "tripcazador-web/**"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Vercel deploy --prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env (prod) — desde repo root
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy --prod (cloud build) — desde repo root
        id: deploy
        continue-on-error: true
        run: |
          # SSS76e: el CLI a veces sale con "Unexpected error" después de
          # subir el tarball pero ANTES de aliasar a producción. Capturamos
          # stdout para extraer la deployment URL aunque el CLI falle, luego
          # promovemos manualmente vía `vercel promote`.
          set -o pipefail
          OUTPUT=$(vercel deploy --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel.out || true)
          # Vercel CLI imprime "Production: <url>" antes de empezar build
          URL=$(grep -oE 'https://tripcazador-[a-z0-9]+-ernesto-talibs-projects\.vercel\.app' /tmp/vercel.out | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Captured deploy URL: $URL"

      - name: Wait for build + promote to production
        id: promote
        run: |
          # SSS76e: aunque el CLI haya fallado, el build sigue corriendo en
          # Vercel cloud. Polleamos la URL hasta 200 OK (max 10min), luego
          # `vercel promote` la pone como producción (alias tripcazador.com).
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then echo "❌ No deploy URL captured" && exit 1; fi
          echo "Polling $URL until ready..."
          for i in $(seq 1 60); do
            STATUS=$(curl -sI -o /dev/null -w "%{http_code}" --max-time 10 "$URL/" || echo "000")
            echo "  attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Build ready"
              break
            fi
            sleep 10
          done
          echo "Promoting $URL to production..."
          vercel promote "$URL" --token=${{ secrets.VERCEL_TOKEN }} --yes || \
            vercel alias set "$URL" tripcazador.com --token=${{ secrets.VERCEL_TOKEN }} || true

      - name: Smoke test new deploy
        run: |
          # Espera 20s a que el alias se propague, luego verifica home
          sleep 20
          curl -fsS --max-time 15 https://tripcazador.com/ | grep -q TripCazador || (echo "home failed" && exit 1)
          curl -fsS --max-time 15 https://tripcazador.com/calculadora | grep -q -i calculadora || (echo "calc failed" && exit 1)
          echo "smoke OK"
