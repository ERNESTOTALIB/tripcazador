name: E2E — Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "tripcazador-web/**"
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tripcazador-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tripcazador-web/package-lock.json

      - name: Install deps
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: https://api.tripcazador.com
        run: npm run build

      - name: Start Next.js
        env:
          PORT: 3000
        run: |
          npm run start &
          for i in {1..30}; do
            curl -sSf http://localhost:3000 > /dev/null && break
            sleep 2
          done

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tripcazador-web/playwright-report/
          retention-days: 14

      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            MSG=$(printf '🚨 <b>E2E Playwright fallo</b>\nRepo: %s\nBranch: %s\nRun: https://github.com/%s/actions/runs/%s' \
              "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.repository }}" "${{ github.run_id }}")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d parse_mode=HTML \
              --data-urlencode "text=${MSG}" || true
          fi
