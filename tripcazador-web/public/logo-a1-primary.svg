<?xml version="1.0" encoding="UTF-8"?>
<!--
  TripCazador A1 — ámbar/marino · LOGO PRIMARIO
  Decisión brand: 2026-05-01
  Uso: web, X, YouTube, Telegram, OG image, favicon, press kit
  Variant L1 (blanco puro) en logo-l1-light.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1530"/>
      <stop offset="60%" stop-color="#0f2452"/>
      <stop offset="100%" stop-color="#163a78"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="1080" height="1080" rx="160" fill="url(#bgSky)"/>

  <!-- Grid sutil -->
  <line x1="0" y1="360" x2="1080" y2="360" stroke="#1e3a6e" stroke-width="2" opacity="0.55"/>
  <line x1="0" y1="720" x2="1080" y2="720" stroke="#1e3a6e" stroke-width="2" opacity="0.55"/>
  <line x1="360" y1="0" x2="360" y2="1080" stroke="#1e3a6e" stroke-width="2" opacity="0.55"/>
  <line x1="720" y1="0" x2="720" y2="1080" stroke="#1e3a6e" stroke-width="2" opacity="0.55"/>

  <!-- Radar -->
  <circle cx="540" cy="468" r="360" fill="url(#radarGlow)"/>
  <circle cx="540" cy="468" r="288" fill="none" stroke="#fbbf24" stroke-width="6" stroke-dasharray="12 18" opacity="0.6"/>
  <circle cx="540" cy="468" r="192" fill="none" stroke="#fbbf24" stroke-width="4.8" stroke-dasharray="6 24" opacity="0.5"/>
  <circle cx="540" cy="468" r="96" fill="none" stroke="#fbbf24" stroke-width="3.6" opacity="0.4"/>

  <!-- Sweep line -->
  <line x1="540" y1="468" x2="750" y2="300" stroke="url(#amberGrad)" stroke-width="15" stroke-linecap="round"/>

  <!-- Avión silueta -->
  <g transform="translate(540 468) rotate(-30) translate(-96 -15)">
    <path d="M0 0 L180 0 L162 -15 L75 -15 L0 -36 L-30 -15 L-96 -15 Z"
          fill="url(#amberGrad)" stroke="#d97706" stroke-width="2.4"/>
    <circle cx="-6" cy="0" r="8.4" fill="#0a1530"/>
  </g>

  <!-- Wordmark -->
  <text x="540" y="888" text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="108" font-weight="800" fill="#ffffff" letter-spacing="12">TRIP</text>
  <text x="540" y="1002" text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="108" font-weight="800" fill="#fbbf24" letter-spacing="12">CAZADOR</text>
</svg>
