# fail2ban filter — 429 abuse en el API de TripCazador
#
# Empareja líneas de log con código 429 devuelto por FastAPI/slowapi.
# Formato esperado: uvicorn access log (combined) o JSON con field "status".

[Definition]
failregex = ^<HOST> .*\"(?:GET|POST|PUT|DELETE) /api/.*\" 429 .*$
            ^.*"client_addr":"<HOST>".*"status":429.*$
ignoreregex =
