name: Revenue snapshot diario

# SSS64 + SSS161: cron daily 02:00 UTC que llama /api/admin/funnel-v2
# para obtener revenue 24h y lo persiste en /api/admin/revenue-history.
# Usa SOLO ADMIN_TOKEN bearer (no panel cookie) — fiabilidad: un solo
# secret. Genera la serie histórica para el gráfico /panel.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  # SSS162: trigger push solo cuando se edita el workflow mismo. Sin esto,
  # GH crea un run "failure" con 0 jobs cada vez que el workflow file
  # cambia en main (porque el push event no matchea ningún job). Con
  # paths-filter el run pasa con todos los jobs skipped.
  push:
    branches: [main]
    paths:
      - ".github/workflows/revenue-snapshot.yml"

concurrency:
  group: revenue-snapshot
  cancel-in-progress: false

jobs:
  noop-on-self-edit:
    name: noop (workflow edit detected)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push event a workflow file — snapshot real corre solo en cron schedule + workflow_dispatch"

  snapshot:
    name: Snapshot revenue del día anterior
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch funnel-v2 (Bearer ADMIN_TOKEN)
        id: fetch
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -e
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::ADMIN_TOKEN secret not set — skipping snapshot. Add it in repo Settings → Secrets."
            exit 0
          fi
          funnel_resp=$(curl -sS -w "\n%{http_code}" \
            "https://tripcazador.com/api/admin/funnel-v2?window=24h" \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          status=$(echo "$funnel_resp" | tail -1)
          body=$(echo "$funnel_resp" | head -n -1)
          if [ "$status" != "200" ]; then
            echo "::error::funnel-v2 returned HTTP $status — body: $body"
            exit 1
          fi
          echo "$body" | python3 -c "
import json, sys
data = json.load(sys.stdin)
revenue = data.get('estimated_revenue_window_eur', 0)
kpis = data.get('kpis_vs_prev', {})
deal_clicks = (kpis.get('deal_clicks') or {}).get('cur', 0)
bookings_out = (kpis.get('bookings_out') or {}).get('cur', 0)
visitors = (kpis.get('visitors') or {}).get('cur', 0)
by_type = data.get('by_type_current') or {}
prem = (by_type.get('premium_cta_click') or 0) + (by_type.get('concierge_click_pay') or 0)
print(f'revenue={revenue}')
print(f'deal_clicks={deal_clicks}')
print(f'bookings={bookings_out}')
print(f'premium_clicks={prem}')
print(f'visitors={visitors}')
print(f'have_data=1')
" >> $GITHUB_OUTPUT

      - name: POST snapshot to revenue-history
        if: steps.fetch.outputs.have_data == '1'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -e
          DATE=$(date -u -d "yesterday" +%Y-%m-%d)
          payload=$(cat <<EOF
{
  "date": "$DATE",
  "revenue_eur": ${{ steps.fetch.outputs.revenue }},
  "deal_clicks": ${{ steps.fetch.outputs.deal_clicks }},
  "bookings_out": ${{ steps.fetch.outputs.bookings }},
  "premium_clicks": ${{ steps.fetch.outputs.premium_clicks }},
  "visitors": ${{ steps.fetch.outputs.visitors }}
}
EOF
)
          curl -sS -X POST "https://tripcazador.com/api/admin/revenue-history" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -d "$payload" \
            -w "\nHTTP %{http_code}\n"
