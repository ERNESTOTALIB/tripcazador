name: Revenue snapshot diario

# SSS64 + SSS161 + SSS186 (15 may 2026): cron daily 02:00 UTC + 14:00 UTC
# que llama /api/admin/funnel-v2 para obtener revenue 24h y lo persiste
# en /api/admin/revenue-history. Genera la serie histórica para el
# gráfico /panel.
#
# SSS186 diagnóstico (15 may 2026):
#   - Audit reveló que `0 2 * * *` jamás disparó (30 runs en 11 días,
#     TODOS event=push y conclusion=failure; cero event=schedule).
#   - Causa raíz: el `push.paths` filter creaba runs "failure" con 0 jobs
#     cada vez que un push tocaba el workflow file. Esos failed runs
#     contaminaban el listing y enmascaraban la ausencia de cron schedule.
#   - Adicionalmente GitHub a veces deja workflows con schedule "stuck"
#     tras cambios al `name:` field (este workflow lo cambió). Workaround:
#     quitar el push trigger + bump al schedule (segundo time slot 14 UTC
#     da redundancia si el primero falla).
#
# Fix:
#   - Eliminar trigger `push` (era SSS162 anti-noise pero a la vez causa
#     de las failures listadas — solo workflow_dispatch + schedule).
#   - Añadir segunda cron entry para redundancia.
#   - Eliminar job noop-on-self-edit que ya no aplica sin push trigger.

on:
  schedule:
    # primer disparo: 02:00 UTC (04:00 CEST verano / 03:00 CET invierno)
    - cron: "0 2 * * *"
    # segundo disparo redundante: 14:00 UTC (16:00 CEST verano / 15:00 CET)
    - cron: "0 14 * * *"
  workflow_dispatch:
  # SSS212+221 (15-16 may 2026): GitHub creaba "synthetic" push runs con
  # 0 jobs / failure cada push a main. SSS212 intentó paths-filter pero
  # no funcionó (paths ignorado para synthetic runs). SSS221 fix:
  # push trigger SIN paths-filter — fuerza GH a ejecutar el no-op job
  # en cada push. Cost: ~5s/push × ~30 pushes/día = 2.5min/día runtime
  # extra. Beneficio: UI completamente limpio, no ghost failures
  # enmascarando fallos reales.
  push:
    branches: [main]

concurrency:
  group: revenue-snapshot
  cancel-in-progress: false

jobs:
  noop-on-push:
    # SSS212: solo corre en push events para producir SUCCESS y silenciar el UI.
    # NO ejecuta lógica real — eso lo hace el job `snapshot` en schedule/dispatch.
    name: No-op (push event — schedule lo hace real)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Echo skip
        run: |
          echo "::notice::Push event — snapshot real corre en cron schedule + workflow_dispatch."
          echo "Workflow OK (no-op success)."

  snapshot:
    # Solo corre en schedule cron o dispatch manual — NUNCA en push.
    if: github.event_name != 'push'
    name: Snapshot revenue del día anterior
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch funnel-v2 (Bearer ADMIN_TOKEN)
        id: fetch
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -e
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::warning::ADMIN_TOKEN secret not set — skipping snapshot. Add it in repo Settings → Secrets."
            exit 0
          fi
          funnel_resp=$(curl -sS -w "\n%{http_code}" \
            "https://tripcazador.com/api/admin/funnel-v2?window=24h" \
            -H "Authorization: Bearer $ADMIN_TOKEN")
          status=$(echo "$funnel_resp" | tail -1)
          body=$(echo "$funnel_resp" | head -n -1)
          if [ "$status" != "200" ]; then
            echo "::error::funnel-v2 returned HTTP $status — body: $body"
            exit 1
          fi
          echo "$body" | python3 -c "
import json, sys
data = json.load(sys.stdin)
revenue = data.get('estimated_revenue_window_eur', 0)
kpis = data.get('kpis_vs_prev', {})
deal_clicks = (kpis.get('deal_clicks') or {}).get('cur', 0)
bookings_out = (kpis.get('bookings_out') or {}).get('cur', 0)
visitors = (kpis.get('visitors') or {}).get('cur', 0)
by_type = data.get('by_type_current') or {}
prem = (by_type.get('premium_cta_click') or 0) + (by_type.get('concierge_click_pay') or 0)
print(f'revenue={revenue}')
print(f'deal_clicks={deal_clicks}')
print(f'bookings={bookings_out}')
print(f'premium_clicks={prem}')
print(f'visitors={visitors}')
print(f'have_data=1')
" >> $GITHUB_OUTPUT

      - name: POST snapshot to revenue-history
        if: steps.fetch.outputs.have_data == '1'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -e
          DATE=$(date -u -d "yesterday" +%Y-%m-%d)
          payload=$(cat <<EOF
{
  "date": "$DATE",
  "revenue_eur": ${{ steps.fetch.outputs.revenue }},
  "deal_clicks": ${{ steps.fetch.outputs.deal_clicks }},
  "bookings_out": ${{ steps.fetch.outputs.bookings }},
  "premium_clicks": ${{ steps.fetch.outputs.premium_clicks }},
  "visitors": ${{ steps.fetch.outputs.visitors }}
}
EOF
)
          curl -sS -X POST "https://tripcazador.com/api/admin/revenue-history" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -d "$payload" \
            -w "\nHTTP %{http_code}\n"
# SSS221 deploy verification touch — 1778882931
