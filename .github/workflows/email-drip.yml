name: Email Drip Cron

# Cron diario 10:00 UTC (= 12:00 ES) — envía emails drip pending a
# subscribers en sus respectivos días post-signup (day1, day3, day7, day14).
# Lifecycle email = retention.
#
# SSS282 (17 may 2026): antes este workflow no existía → drip-cron endpoint
# nunca se invocaba → 0% lifecycle email. Add this workflow.
#
# Requiere:
#  - DRIP_CRON_TOKEN secret GH = mismo valor que NEXT_PUBLIC_DRIP_CRON_TOKEN
#    (en realidad DRIP_CRON_TOKEN server-side) en Vercel env.
#  - RESEND_API_KEY ya seteado en Vercel (sin él endpoint devuelve resend_active=false).

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger drip-cron endpoint
        id: send
        run: |
          STATUS=$(curl -s -o /tmp/drip.json -w "%{http_code}" \
            "https://tripcazador.com/api/email/drip-cron?token=${{ secrets.DRIP_CRON_TOKEN }}" \
            --max-time 60)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          cat /tmp/drip.json | head -c 1000
          # DRIP-FIX (31 may 2026): fail loud si HTTP != 200.
          # Antes el cron marcaba Success aunque endpoint devolviera 401/503 →
          # 14 runs ✅ verdes pero 0 emails enviados durante semanas. Ahora
          # exit 1 si status != 200 → job FAILED + Telegram notify dispara.
          if [ "$STATUS" != "200" ]; then
            echo ""
            echo "::error::email-drip endpoint returned HTTP $STATUS (esperado 200). Revisar DRIP_CRON_TOKEN match GH ↔ Vercel."
            exit 1
          fi

      - name: Notify Telegram on failure
        # DRIP-FIX: usar `failure()` + `secrets.TELEGRAM_BOT_TOKEN` (env.X no
        # accesible en if: expression antes de exponer env). Antes esta
        # condición NUNCA disparaba → fails pasaban desapercibidos.
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠ Email drip-cron failed HTTP ${{ steps.send.outputs.status }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MSG"
