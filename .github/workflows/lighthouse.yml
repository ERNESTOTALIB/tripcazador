name: Lighthouse CI

# Bloquea PR si Web Vitals + a11y caen por debajo de los thresholds.
# Corre contra el preview deployment de Vercel.
#
# Thresholds (abr-2026o):
#   - Performance score >= 0.85 (LCP P75 < 2.5s, INP < 200ms, CLS < 0.1)
#   - Accessibility >= 0.95 (WCAG AA)
#   - Best practices >= 0.90
#   - SEO >= 0.95
#
# Si el PR no genera preview Vercel (forks externos, drafts), el workflow
# se skipea silenciosamente — no bloqueamos contribuciones por infra ajena.

on:
  pull_request:
    branches: [main]
    paths:
      - "tripcazador-web/**"
      - ".github/workflows/lighthouse.yml"
  # SSS163: cron semanal sobre prod para detectar regresiones perf
  # incluso sin PRs (usamos push directo a main, sin preview).
  # SSS188 (15 may 2026): añadido segundo cron diurno para redundancia tras
  # detectar que `0 6 * * 1` (lunes 06:00) jamás disparó en 24 días (3 lunes
  # missed). Probable cron-stuck bug de GitHub Actions tras updates al workflow.
  schedule:
    - cron: "0 6 * * 1"   # lunes 06:00 UTC (mañana europea)
    - cron: "0 18 * * 4"  # jueves 18:00 UTC redundante (mid-week health check)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # En cron/manual run, no hay preview — usa prod directo.
      - name: Determine target URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=" >> $GITHUB_OUTPUT  # wait_preview se encarga
            echo "use_preview=1" >> $GITHUB_OUTPUT
          else
            echo "url=https://tripcazador.com" >> $GITHUB_OUTPUT
            echo "use_preview=0" >> $GITHUB_OUTPUT
          fi

      # Esperar al preview Vercel — solo en PR — este action escucha al webhook.
      - name: Wait for Vercel preview
        id: wait_preview
        if: steps.target.outputs.use_preview == '1'
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          allow_inactive: false
        continue-on-error: true

      - name: Skip if PR and no preview URL
        if: steps.target.outputs.use_preview == '1' && steps.wait_preview.outputs.url == ''
        run: |
          echo "::warning::No preview URL — skipping Lighthouse"
          exit 0

      - name: Compute base URL
        id: base
        run: |
          if [ "${{ steps.target.outputs.use_preview }}" = "1" ]; then
            echo "url=${{ steps.wait_preview.outputs.url }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ steps.target.outputs.url }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Lighthouse CI
        if: steps.base.outputs.url != ''
        id: lhci
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ steps.base.outputs.url }}/
            ${{ steps.base.outputs.url }}/deals
            ${{ steps.base.outputs.url }}/blog
            ${{ steps.base.outputs.url }}/destinos/japon
            ${{ steps.base.outputs.url }}/destinos/lisboa
            ${{ steps.base.outputs.url }}/destinos/paris
            ${{ steps.base.outputs.url }}/it/destinos/japan
            ${{ steps.base.outputs.url }}/de/destinos/paris
            ${{ steps.base.outputs.url }}/vuelos/madrid-lisboa
            ${{ steps.base.outputs.url }}/vuelos/barcelona-paris
            ${{ steps.base.outputs.url }}/aerolineas/iberia
            ${{ steps.base.outputs.url }}/aerolineas/qr
            ${{ steps.base.outputs.url }}/comparar-aerolineas/iberia-vs-vueling
            ${{ steps.base.outputs.url }}/comparar-aerolineas/qatar-vs-emirates
          configPath: ".github/workflows/lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment results on PR
        if: steps.lhci.outputs.manifest != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const manifest = JSON.parse(`${{ steps.lhci.outputs.manifest }}`);
            const summary = manifest.map(r => {
              const s = r.summary || {};
              return `**${r.url}** — perf ${(s.performance*100).toFixed(0)}, a11y ${(s.accessibility*100).toFixed(0)}, bp ${(s['best-practices']*100).toFixed(0)}, seo ${(s.seo*100).toFixed(0)}`;
            }).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚦 Lighthouse CI\n\n${summary}\n\nFull report: ${process.env.LHCI_REPORT_URL || 'see job artifacts'}`
            });
