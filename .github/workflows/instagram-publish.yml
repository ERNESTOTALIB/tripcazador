name: Instagram auto-publish deals

on:
  # SSS74 (May 2026): cron pausado durante validación del nuevo diseño
  # Barcelona magazine 5-plate carousel. Reactivar tras smoke verde de
  # los 5 endpoints + verificación del primer post manual.
  # schedule:
  #   - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish top deal to Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # SSS65: persistir historial de posts entre runs vía cache.
      # Permite que el script lea los últimos 2 destinos publicados y
      # filtre deals para no repetir origen/destino consecutivamente.
      - name: Restore post history cache
        id: history-cache
        uses: actions/cache/restore@v4
        with:
          path: .instagram_post_history.json
          key: ig-post-history-v1-${{ github.run_id }}
          # Fallback prefix: GH cache picks most recent matching this prefix.
          # Permite que cada run lea el historial del run anterior.
          restore-keys: |
            ig-post-history-v1-

      - name: Run script
        env:
          SITE_URL: https://tripcazador.com
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_DEDUP_WINDOW: "2"
          # SSS72: primer arranque debe ser un vuelo bajo 100€ ida+vuelta.
          # Quitar/relajar después del primer post si quieres también hoteles.
          IG_FILTER_TYPE: "flight"
          IG_MAX_PRICE: "100"
          # SSS74 (May 2026): activado modo carrusel 5-plate Barcelona magazine.
          # Slide 1 = /api/og/social/post (hero serif + price panel)
          # Slides 2-5 = /api/og/social/carousel?slide={places|food|tips|cta}
          IG_CAROUSEL_MODE: "1"
        run: python scripts/instagram_publish_deals.py

      # Save updated history back. cache@save creates a new entry with
      # the run_id-suffixed key; restore step picks up most recent matching
      # prefix automatically next run.
      - name: Save post history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .instagram_post_history.json
          key: ig-post-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
