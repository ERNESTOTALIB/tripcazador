name: Newsletter Weekly

# Cron domingo 18:00 UTC — envía top 5 chollos críticos/error a suscriptores
# vía endpoint /api/email/newsletter-weekly. El endpoint:
#   - filtra CRÍTICO/ERROR Spain-first
#   - si RESEND_API_KEY no está set en Vercel, devuelve 200 sent=0 (no falla)
#   - rate-limit 6h en proceso (idempotente safety net)
#
# Requiere secret ADMIN_TOKEN.

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger newsletter-weekly endpoint
        id: send
        run: |
          STATUS=$(curl -s -o /tmp/newsletter.json -w "%{http_code}" \
            "https://tripcazador.com/api/email/newsletter-weekly?token=${{ secrets.ADMIN_TOKEN }}" \
            --max-time 90)
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "--- response ---"
          cat /tmp/newsletter.json | head -c 1000
          echo
          # Falla si el endpoint devolvió >= 400 (rate-limit 429 también).
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Newsletter weekly endpoint returned HTTP $STATUS"
            exit 1
          fi

      - name: Notify Telegram on failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠️ Newsletter weekly failed (status ${{ steps.send.outputs.status }})\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MSG" \
            -d parse_mode="HTML" || true
